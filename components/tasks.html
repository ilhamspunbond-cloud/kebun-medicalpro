<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ILHAM SPUNBOND & Medical Pro Dashboard</title>
  <!-- Tailwind CSS untuk styling responsif -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar Navigasi Utama -->
    <aside class="w-64 bg-white border-r hidden md:block">
      <div class="p-4 font-bold text-lg text-gray-800 border-b">Menu Aplikasi</div>
      <nav class="space-y-1 p-2">
        <button onclick="loadPage('home_ai')" class="w-full text-left px-4 py-2 rounded hover:bg-gray-100 font-medium text-gray-700">Dashboard AI</button>
        <button onclick="loadPage('expenses')" class="w-full text-left px-4 py-2 rounded hover:bg-gray-100 font-medium text-gray-700">Expenses</button>
        <button onclick="loadPage('income')" class="w-full text-left px-4 py-2 rounded hover:bg-gray-100 font-medium text-gray-700">Income</button>
        <button onclick="loadPage('inventory')" class="w-full text-left px-4 py-2 rounded hover:bg-gray-100 font-medium text-gray-700">Inventory</button>
        <button onclick="loadPage('office')" class="w-full text-left px-4 py-2 rounded hover:bg-gray-100 font-medium text-gray-700">Office</button>
        <button onclick="loadPage('supply')" class="w-full text-left px-4 py-2 rounded hover:bg-gray-100 font-medium text-gray-700">Supply</button>
        <button onclick="loadPage('tasks')" class="w-full text-left px-4 py-2 rounded hover:bg-gray-100 font-medium text-gray-700">Tasks</button>
      </nav>
    </aside>

    <!-- Area Konten Utama -->
    <main class="flex-1 overflow-y-auto p-6">
      <div id="main-content">
        <!-- Konten komponen akan dimuat secara otomatis di sini -->
      </div>
    </main>
  </div>

  <!-- Script untuk memuat file komponen secara mulus tanpa nge-lag -->
  <script>
    async function loadPage(pageName) {
      try {
        // Mengambil file HTML dari folder components sesuai nama halamannya
        const response = await fetch(`components/${pageName}.html`);
        if (!response.ok) throw new Error('Halaman tidak ditemukan');
        const htmlContent = await response.text();
        
        // Memasukkan kode HTML asli Anda ke dalam container tanpa merubah isinya
        document.getElementById('main-content').innerHTML = htmlContent;
      } catch (error) {
        console.error('Gagal memuat:', error);
        document.getElementById('main-content').innerHTML = '<div class="p-4 text-red-500">Gagal memuat komponen halaman.</div>';
      }
    }

    // Memuat halaman utama (home_ai) secara otomatis saat pertama kali dibuka
    window.onload = () => {
      loadPage('home_ai');
    };
  </script>
</body>
</html>
