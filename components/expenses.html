<section id="page-expenses" class="tab-page bg-white p-6 rounded-2xl shadow-sm border space-y-4">
    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-3">
        <h3 id="expenseFormTitle" class="text-lg font-bold text-emerald-800">💰 Perbelanjaan Ladang (Bulanan)</h3>
        <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
            <div class="flex items-center gap-1 bg-slate-50 p-1.5 rounded-xl border text-xs">
                <span class="text-slate-500 font-bold">Dari:</span>
                <input type="date" id="filterExpenseStart" onchange="renderExpenses()" class="bg-white border p-1 rounded">
                <span class="text-slate-500 font-bold">Hingga:</span>
                <input type="date" id="filterExpenseEnd" onchange="renderExpenses()" class="bg-white border p-1 rounded">
            </div>
            <select id="filterExpenseMonth" onchange="renderExpenses()" class="border p-2 rounded-lg text-xs bg-white font-semibold">
                <option value="all">Semua Bulan (Global)</option>
            </select>
            <button type="button" onclick="generateMonthlyInvoice('expenses')" id="btnPrintExpPdf" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-xs font-bold shadow">🖨️ Cetak Rumusan PDF</button>
        </div>
    </div>

    <form id="expenseForm" onsubmit="handleExpenseFormSubmit(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 bg-slate-50 p-4 rounded-xl border">
        <input type="hidden" id="editingExpenseId" value="">
        <input type="text" id="expTitle" placeholder="Keterangan Perbelanjaan" required class="border p-2 rounded-lg text-sm bg-white">
        <div class="flex gap-1">
            <input type="text" id="expAmount" placeholder="Jumlah Kos" required class="border p-2 rounded-lg text-sm bg-white flex-1">
            <span id="expCurrencyDisplay" class="bg-slate-200 border px-2 py-2 rounded-lg text-xs font-bold flex items-center">RM</span>
        </div>
        <input type="date" id="expDate" required class="border p-2 rounded-lg text-sm bg-white">
        <div>
            <label id="lblExpReceipt" class="block text-[10px] font-semibold text-slate-500 mb-1">Resit HD</label>
            <input type="file" id="expReceiptInput" accept="image/*" class="w-full border p-1 rounded-lg text-xs bg-white">
        </div>
        <div class="sm:col-span-4 flex gap-2">
            <button type="submit" id="btnExpenseSubmit" class="flex-1 bg-emerald-600 text-white py-2 rounded-lg text-xs font-semibold">Tambah Perbelanjaan</button>
            <button type="button" id="btnCancelExpenseEdit" onclick="resetExpenseForm()" class="hidden bg-slate-300 hover:bg-slate-400 text-slate-800 text-xs font-bold py-2 px-4 rounded-lg">Batal</button>
        </div>
    </form>

    <div class="overflow-x-auto">
        <table class="w-full text-left text-sm border-collapse">
            <thead>
                <tr class="bg-slate-100 border-b">
                    <th id="thExpReceipt" class="p-3">Resit HD</th>
                    <th id="thExpDesc" class="p-3">Keterangan</th>
                    <th id="thExpCost" class="p-3">Kos</th>
                    <th id="thExpDate" class="p-3">Tarikh</th>
                    <th id="thExpAction" class="p-3 text-center">Tindakan</th>
                </tr>
            </thead>
            <tbody id="expenseTableBody"></tbody>
        </table>
    </div>
</section>
