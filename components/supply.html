<section id="page-supply" class="tab-page bg-white p-6 rounded-2xl shadow-sm border space-y-4">
    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-3 border-b pb-3">
        <div>
            <h3 id="lblSupplyMgmtTitle" class="text-lg font-bold text-slate-900">📦 Pengurusan Stok & Bekalan Ladang</h3>
            <p id="lblSupplyMgmtSub" class="text-xs text-slate-500">Catat hasil tuaian (masuk stok gudang) atau cetak Laporan Bekalan Ladang</p>
        </div>
        <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
            <div class="flex items-center gap-1 bg-slate-50 p-1.5 rounded-xl border text-xs">
                <span class="text-slate-500 font-bold">Dari:</span>
                <input type="date" id="filterSupplyStart" onchange="renderSupplyApp()" class="bg-white border p-1 rounded">
                <span class="text-slate-500 font-bold">Hingga:</span>
                <input type="date" id="filterSupplyEnd" onchange="renderSupplyApp()" class="bg-white border p-1 rounded">
            </div>
            <select id="filterSupplyMonth" onchange="renderSupplyApp()" class="border p-2 rounded-lg text-xs bg-white font-semibold">
                <option value="all">Semua Bulan (Global)</option>
            </select>
            <button type="button" onclick="generateSupplyReportModal()" id="btnPrintSupplyPdf" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-xs font-bold shadow">🖨️ Cetak Laporan Bekalan PDF</button>
        </div>
    </div>

    <form id="supplyForm" onsubmit="handleSupplyFormSubmit(event)" class="bg-slate-50 p-4 rounded-2xl space-y-3 border border-slate-200">
        <input type="hidden" id="editingSupplyId" value="">
        <div id="supplyFormTitle" class="text-xs font-bold text-slate-700 uppercase">➕ Input Hasil Tuaian Baharu (Masuk Stok)</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
                <label id="lblHarvestDate" class="text-xs text-slate-600 block mb-1">Tarikh Tuaian</label>
                <input type="date" id="inputDate" required class="w-full text-xs p-2 rounded-xl border bg-white">
            </div>
            <div>
                <label id="lblHarvestItem" class="text-xs text-slate-600 block mb-1">Jenis Hasil Ladang</label>
                <select id="inputItem" onchange="onSupplyItemChange()" class="w-full text-xs p-2 rounded-xl border bg-white">
                    <option value="Buah Belimbing Buluh kering">Buah Belimbing Buluh kering (kg)</option>
                    <option value="Buah Belimbing Buluh besar">Buah Belimbing Buluh besar (kg)</option>
                    <option value="Buah Belimbing kismis">Buah Belimbing kismis (kg)</option>
                    <option value="Daun Teh Belimbing Buluh">Daun Teh Belimbing Buluh (kg)</option>
                    <option value="Daun ubat/krim Belimbing Buluh">Daun ubat/krim Belimbing Buluh (kg)</option>
                    <option value="Daun Tajus">Daun Tajus (kg)</option>
                    <option value="Limau">Limau (kg)</option>
                    <option value="Bunga Kantan">Bunga Kantan (tangkai)</option>
                </select>
            </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
                <label id="lblHarvestQty" class="text-xs text-slate-600 block mb-1">Jumlah & Unit (Automatik)</label>
                <div class="flex gap-1">
                    <input type="number" id="inputQty" placeholder="Jumlah (Cth: 5.5)" step="0.01" min="0.01" required class="w-2/3 text-xs p-2 rounded-xl border bg-white">
                    <input type="text" id="inputUnitDisplay" readonly value="kg" class="w-1/3 text-xs p-2 rounded-xl border bg-slate-100 font-bold text-emerald-700 text-center">
                </div>
            </div>
            <div>
                <label id="lblHarvestDesc" class="text-xs text-slate-600 block mb-1">Keterangan / Blok Ladang</label>
                <input type="text" id="inputDesc" placeholder="Contoh: Blok A" class="w-full text-xs p-2 rounded-xl border bg-white">
            </div>
        </div>
        <div class="flex gap-2">
            <button type="submit" id="btnSupplySubmit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 rounded-xl">Simpan ke Stok Gudang</button>
            <button type="button" id="btnCancelSupplyEdit" onclick="resetSupplyForm()" class="hidden bg-slate-300 hover:bg-slate-400 text-slate-800 text-xs font-bold py-2.5 px-4 rounded-xl">Batal</button>
        </div>
    </form>

    <div>
        <div id="lblStockSummaryTitle" class="text-xs font-bold text-slate-700 uppercase mb-2">📊 Rumusan Baki Stok Gudang:</div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2" id="stockSummaryContainer"></div>
    </div>

    <div>
        <div id="lblSupplyHistoryTitle" class="text-xs font-bold text-slate-700 uppercase mb-2">📋 Riwayat & Aksi Bekalan:</div>
        <div class="overflow-x-auto">
            <table class="w-full text-left text-xs border-collapse">
                <thead>
                    <tr class="bg-slate-100 border-b">
                        <th id="thSupplyDate" class="p-2">Tarikh</th>
                        <th id="thSupplyItem" class="p-2">Item</th>
                        <th id="thSupplyStatus" class="p-2">Status / Aksi</th>
                        <th id="thSupplyQty" class="p-2">Jumlah</th>
                        <th id="thSupplyDesc" class="p-2">Keterangan</th>
                        <th id="thSupplyAction" class="p-2 text-center">Tindakan</th>
                    </tr>
                </thead>
                <tbody id="supplyTableBody"></tbody>
            </table>
        </div>
    </div>
</section>
